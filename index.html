<header><h1>FRESADORA <span>PRO</span></h1><small>Engenharia e usinagem · Torno e Fresadora</small></header><div class="sec" id="sec"></div>
<main id="app"></main>

<script>
"use strict";
/* ===== NÚCLEO MATEMÁTICO (puro, testável) ===== */
const rad=d=>d*Math.PI/180, gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const r3=x=>Math.round(x*1000)/1000;
const BS={ "Brown & Sharpe":[[15,16,17,18,19,20],[21,23,27,29,31,33],[37,39,41,43,47,49]].flat() };
function cutterNo(z){ // jogo de 8 fresas módulo (prática usual)
  const t=[[12,13,1],[14,16,2],[17,20,3],[21,25,4],[26,34,5],[35,54,6],[55,134,7]];
  for(const [a,b,n] of t) if(z>=a&&z<=b) return n; return z>134?8:null; }
function spur(m,z,a,b){
  if(!(m>0)) throw "Módulo deve ser > 0";
  if(!Number.isInteger(z)||z<6) throw "Dentes: inteiro ≥ 6";
  if(!(a>0&&a<45)) throw "Ângulo de pressão entre 0 e 45°";
  const d=m*z, ha=m, hf=1.25*m, h=ha+hf, p=Math.PI*m, k=rad(90)/z;
  return {d, da:m*(z+2), df:d-2*hf, db:d*Math.cos(rad(a)), ha, hf, h, p, s:p/2, e:p/2,
    sc:d*Math.sin(k), hc:ha+d/2*(1-Math.cos(k)), fresa:cutterNo(z), b};
}
function rack(m,n,z){
  if(!(m>0)||!Number.isInteger(n)||n<1) throw "Módulo > 0 e dentes inteiro ≥ 1";
  const p=Math.PI*m; return {p, h:2.25*m, ha:m, hf:1.25*m, s:p/2, L:n*p, dp:z?m*z:null, cc:z?m*z/2:null};
}
function indirect(N,R,plate){
  if(!Number.isInteger(N)||N<2) throw "Divisões: inteiro ≥ 2";
  if(!(R>0)) throw "Relação do cabeçote inválida";
  const whole=Math.floor(R/N), num=R-whole*N;
  if(num===0) return {whole,num:0,den:1,circle:null,holes:0};
  const g=gcd(num,N), n=num/g, den=N/g;
  const c=plate.filter(c=>c%den===0).sort((a,b)=>a-b)[0];
  return {whole,num:n,den,circle:c||null,holes:c?n*c/den:null,N,R};
}
function angular(ang,R,plate){
  const t=ang*R/360, whole=Math.floor(t), f=t-whole, best=[];
  for(const c of plate){const h=Math.round(f*c), real=(whole+h/c)*360/R; best.push({c,h,err:real-ang});}
  best.sort((a,b)=>Math.abs(a.err)-Math.abs(b.err)); return {t,whole,best:best.slice(0,3)};
}
function cut(Vc,D,z,fz,L,ap){
  if(!(Vc>0&&D>0&&z>0&&fz>0)) throw "Preencha Vc, D, z e fz com valores > 0";
  const n=1000*Vc/(Math.PI*D), vf=fz*z*n; return {n,vf,t:(L+ap)/vf,Vc2:Math.PI*D*n/1000};
}
/* materiais: faixas INICIAIS indicativas (m/min) — confirmar no catálogo do fabricante */
const MAT={"Aço SAE 1020":[25,35,120,200],"Aço SAE 1045":[20,30,100,160],"Aço SAE 4140":[15,25,90,150],
"Aço inoxidável":[10,18,60,110],"Alumínio":[100,300,300,800],"Bronze":[30,60,100,200],"Latão":[40,70,120,250],"Ferro fundido":[15,25,70,130]};


/* ===== TORNO: núcleo ===== */
const MATT={"Aço SAE 1020":[30,45,180,280],"Aço SAE 1045":[25,35,150,220],"Aço SAE 4140":[20,30,120,200],"Aço inoxidável":[12,20,80,150],"Alumínio":[100,250,300,800],"Bronze":[40,70,120,250],"Latão":[60,100,150,300],"Ferro fundido":[20,30,90,180]};
function turn(Vc,D,f,L,r){
  if(!(Vc>0&&D>0&&f>0&&L>0)) throw "Preencha Vc, D, avanço e comprimento com valores > 0";
  const n=1000*Vc/(Math.PI*D), vf=f*n; return {n,vf,t:L/vf,Ra:r>0?f*f/(8*r)*1000:null};
}
function cone(D,d,L,Lt){
  if(!(D>d&&d>=0&&L>0)) throw "D deve ser maior que d e L > 0";
  const half=Math.atan((D-d)/(2*L))*180/Math.PI; return {C:(D-d)/L,ratio:L/(D-d),half,full:2*half,off:(D-d)/2*((Lt>0?Lt:L)/L)};
}
function thread(d,P,ang){
  if(!(d>0&&P>0&&P<d)) throw "Diâmetro > 0 e passo menor que o diâmetro";
  const w=ang==55, k=w?0.6403:0.6134; return {h:k*P,d3:d-2*k*P,d2:d-(w?0.6403:0.6495)*P,D1:d-(w?1.2806:1.0825)*P};
}
function trainGears(ratio,set){
  if(!(ratio>0)) throw "Relação inválida"; const best=[];
  const add=(g,r)=>{const e=Math.abs(r-ratio)/ratio; if(e<2e-3){best.push({g,e});}};
  for(const a of set)for(const b of set)add([a,b],a/b);
  for(const a of set)for(const b of set)for(const c of set)for(const d of set)add([a,b,c,d],a*c/(b*d));
  best.sort((x,y)=>x.e-y.e||x.g.length-y.g.length); return best.slice(0,4);
}


/* ===== ENGRENAGENS: núcleo (todos os tipos) ===== */
const deg=r=>r*180/Math.PI, STD=[1,1.125,1.25,1.375,1.5,1.75,2,2.25,2.5,2.75,3,3.5,4,4.5,5,5.5,6,7,8,9,10,11,12,14,16,18,20,22,25,28,32,36,40,45,50];
function helical(mn,z,an,be){
  if(!(mn>0)||!Number.isInteger(z)||z<6) throw "mn > 0 e z inteiro ≥ 6";
  if(!(an>0&&an<45)||!(be>0&&be<45)) throw "Ângulos (αn e β) entre 0 e 45°";
  const cb=Math.cos(rad(be)), mt=mn/cb, d=mt*z, at=Math.atan(Math.tan(rad(an))/cb), zv=z/(cb**3);
  return {mt,d,da:d+2*mn,df:d-2.5*mn,pn:Math.PI*mn,pt:Math.PI*mt,lead:Math.PI*d/Math.tan(rad(be)),at:deg(at),db:d*Math.cos(at),zv,fresa:cutterNo(Math.round(zv)),h:2.25*mn};
}
const DH=[24,24,28,32,40,44,48,56,64,72,86,100];
function bevel(m,z1,z2,S){
  if(!(m>0)||!Number.isInteger(z1)||!Number.isInteger(z2)||z1<6||z2<6) throw "m > 0 e z1, z2 inteiros ≥ 6";
  if(!(S>0&&S<180)) throw "Ângulo entre eixos Σ entre 0 e 180°";
  const s=rad(S), d1=m*z1, d2=m*z2, a1=Math.atan(Math.sin(s)/(z2/z1+Math.cos(s))), a2=s-a1, Re=d1/(2*Math.sin(a1)), ta=Math.atan(m/Re), tf=Math.atan(1.25*m/Re);
  return {d1,d2,a1:deg(a1),a2:deg(a2),Re,da1:d1+2*m*Math.cos(a1),da2:d2+2*m*Math.cos(a2),h:2.25*m,b:Re/3,head1:deg(a1+ta),root1:deg(a1-tf),head2:deg(a2+ta),root2:deg(a2-tf),zv1:z1/Math.cos(a1),zv2:z2/Math.cos(a2),i:z2/z1};
}
function bevelH(m,z1,z2,S,be,an,b){
  const c=bevel(m,z1,z2,S);
  if(!(be>0&&be<=45)||!(an>0&&an<45)) throw "β entre 0 e 45° e αn entre 0 e 45°";
  if(!(b>0&&b<c.Re)) throw "Largura b > 0 e menor que a distância cônica Re ("+r3(c.Re)+" mm)";
  const cb=Math.cos(rad(be)), Rm=c.Re-b/2, k=Rm/c.Re, mt=m*k, mn=mt*cb,
   zn1=z1/(Math.cos(rad(c.a1))*cb**3), zn2=z2/(Math.cos(rad(c.a2))*cb**3),
   dm1=c.d1*k, dm2=c.d2*k, g1=Math.PI*dm1/Math.tan(rad(be)), g2=Math.PI*dm2/Math.tan(rad(be));
  return {...c,b,Rm,mt,mn,dm1,dm2,zn1,zn2,g1,g2,x1:g1*Math.cos(rad(c.a1)),x2:g2*Math.cos(rad(c.a2)),
   at:deg(Math.atan(Math.tan(rad(an))/cb)),eb:b*Math.sin(rad(be))/(Math.PI*mn)};
}
function worm(m,z1,z2,d1){
  if(!(m>0)||!Number.isInteger(z1)||!Number.isInteger(z2)||z1<1||z2<=z1) throw "m > 0; entradas z1 ≥ 1 e dentes da coroa z2 > z1 (inteiros)";
  if(!(d1>=2*m)) throw "Ø primitivo do sem-fim deve ser ≥ 2·m";
  const d2=m*z2; return {px:Math.PI*m,lead:Math.PI*m*z1,gam:deg(Math.atan(m*z1/d1)),q:d1/m,d2,a:(d1+d2)/2,da1:d1+2*m,df1:d1-2.5*m,da2:d2+2*m,df2:d2-2.5*m,h:2.25*m,i:z2/z1};
}
function internalG(m,z,zp){
  if(!(m>0)||!Number.isInteger(z)||!Number.isInteger(zp)||zp<6) throw "m > 0; z e z do pinhão inteiros (pinhão ≥ 6)";
  if(!(z>zp)) throw "A coroa interna deve ter mais dentes que o pinhão";
  const d=m*z; return {d,di:d-2*m,dr:d+2.5*m,dp:m*zp,dap:m*(zp+2),a:m*(z-zp)/2,i:z/zp,warn:(z-zp)<10};
}
function reductor(n,P,eta,st){
  if(!(n>0&&P>0&&eta>0&&eta<=1)) throw "Rotação > 0, potência > 0 e rendimento entre 0 e 1";
  if(!st.length) throw "Informe pelo menos um estágio (m, z1, z2)";
  let i=1,ef=1,rpm=n; const o=[];
  for(const x of st){ if(!(x.m>0&&x.z1>=6&&x.z2>=6)) throw "Estágio inválido (m > 0, z ≥ 6)"; const ii=x.z2/x.z1; i*=ii; ef*=eta; rpm/=ii; o.push({ii,a:x.m*(x.z1+x.z2)/2,d1:x.m*x.z1,d2:x.m*x.z2,rpm}); }
  const Tin=9550*P/n; return {o,i,rpm,ef,Tin,Tout:Tin*i*ef,Pout:P*ef};
}
function reposicao(da,z,al){
  if(!(da>0)||!Number.isInteger(z)||z<6) throw "Ø externo > 0 e z inteiro ≥ 6";
  const m=da/(z+2), ns=STD.reduce((a,b)=>Math.abs(b-m)<Math.abs(a-m)?b:a), k=Math.round(z*al/180+0.5), inv=Math.tan(rad(al))-rad(al);
  return {m,ns,k,W:ns*Math.cos(rad(al))*(Math.PI*(k-0.5)+z*inv)};
}

/* ===== TESTES AUTOMATIZADOS ===== */
function tests(){
  const T=[],eq=(n,a,b,tol=1e-3)=>T.push([n,Math.abs(a-b)<=tol,a,b]);
  const g=spur(2,20,20,10); eq("Engr. m2 z20: d=40",g.d,40); eq("da=44",g.da,44); eq("df=35",g.df,35);
  eq("db=40·cos20°",g.db,37.5877,1e-3); eq("p=2π",g.p,6.2832,1e-3); eq("h=4,5",g.h,4.5);
  eq("Fresa nº p/ z=20",g.fresa,3); eq("Fresa nº p/ z=100",cutterNo(100),7);
  const i=indirect(17,40,BS["Brown & Sharpe"]); eq("40/17 → 2 voltas",i.whole,2); eq("…+6 furos no círculo 17",i.holes,6);
  const j=indirect(28,40,BS["Brown & Sharpe"]); eq("40/28 → 1 volta",j.whole,1); eq("…círculo 21, 9 furos",j.circle*1000+j.holes,21009);
  const k=indirect(41,40,BS["Brown & Sharpe"]); eq("40/41 → 0 voltas, 40 furos no 41",k.holes,40);
  eq("Divisão 10 → 4 voltas",indirect(10,40,[]).whole,4);
  const c=cut(25,50,4,0.05,100,10); eq("RPM Vc25 D50",c.n,159.155,1e-2); eq("Avanço mm/min",c.vf,31.831,1e-2); eq("Tempo min",c.t,3.455,1e-2);
  const r=rack(2,10,20); eq("Cremalheira L=10·2π",r.L,62.832,1e-2); eq("Dist. entre centros",r.cc,20);
  eq("Ângulo 9° → 1 volta (R40)",angular(9,40,[18]).t,1);
  const t1=turn(100,50,0.2,100,0.8); eq("Torno rpm Vc100 D50",t1.n,636.62,1e-2); eq("Torno avanço mm/min",t1.vf,127.324,1e-2); eq("Torno tempo min",t1.t,0.7854,1e-3); eq("Ra teórica µm",t1.Ra,6.25,1e-6);
  const c1=cone(40,30,50,200); eq("Cone: semiângulo °",c1.half,5.7106,1e-3); eq("Cone: desloc. contraponta mm",c1.off,20,1e-6);
  const r1=thread(10,1.5,60); eq("M10x1,5: profundidade",r1.h,0.9201,1e-3); eq("M10x1,5: Ø do núcleo",r1.d3,8.1598,1e-3); eq("M10x1,5: Ø furo int.",r1.D1,8.3763,1e-3);
  const h1=helical(2,20,20,15); eq("Helicoidal: d=mt·z",h1.d,41.411,1e-3); eq("Helicoidal: L·tanβ=π·d",h1.lead*Math.tan(rad(15)),Math.PI*h1.d,1e-6); eq("Helicoidal: αt",h1.at,20.647,5e-3);
  const b1=bevel(3,20,40,90); eq("Cônica: δ1",b1.a1,26.565,1e-3); eq("Cônica: δ2",b1.a2,63.435,1e-3); eq("Cônica: Re",b1.Re,67.082,1e-3);
  const bh=bevelH(3,20,40,90,30,20,20); eq("Cônica hel.: Rm",bh.Rm,57.0820,1e-3); eq("Cônica hel.: mn médio",bh.mn,2.2108,1e-3); eq("Cônica hel.: εβ",bh.eb,1.4398,1e-3); eq("Cônica hel.: zvn1",bh.zn1,34.427,1e-2);
  const w1=worm(4,2,30,40); eq("Sem-fim: ângulo de avanço",w1.gam,11.31,1e-2); eq("Sem-fim: avanço",w1.lead,25.133,1e-3); eq("Sem-fim: entre centros",w1.a,80);
  const n1=internalG(2,60,20); eq("Interna: entre centros",n1.a,40); eq("Interna: Ø de topo",n1.di,116);
  const rd=reductor(1500,5,0.98,[{m:2,z1:20,z2:40},{m:2,z1:20,z2:50}]); eq("Redutor: i total",rd.i,5); eq("Redutor: rpm saída",rd.rpm,300); eq("Redutor: torque saída",rd.Tout,(9550*5/1500)*5*0.98*0.98,1e-6);
  const rp=reposicao(44,20,20); eq("Reposição: módulo",rp.m,2); eq("Reposição: W3 (m2,z20)",rp.W,15.3209,1e-2);
  const tg=trainGears(0.25,[20,40,80]); eq("Engr. troca 0,25 → 20/80",tg[0].g[0]*1000+tg[0].g[1],20080);
  return T;
}

/* ===== INTERFACE ===== */
const $=id=>document.getElementById(id), N=id=>parseFloat($(id).value);
const fld=(id,l,v,s="any")=>`<label>${l}<input id="${id}" type="number" inputmode="decimal" step="${s}" value="${v}"></label>`;
const rows=a=>`<table>${a.map(([l,v,f])=>`<tr><td>${l}</td><td>${v}</td><td>${f||""}</td></tr>`).join("")}</table>`;
let hist=[]; try{hist=JSON.parse(localStorage.getItem("fp_hist")||"[]")}catch(e){}
function save(t,txt){hist.unshift({t,txt,d:new Date().toLocaleString("pt-BR")});hist=hist.slice(0,50);try{localStorage.setItem("fp_hist",JSON.stringify(hist))}catch(e){}}
const out=(id,html)=>{$(id).innerHTML=html;if(document.getElementById("cvL"))bootL()}, bad=e=>`<p class="err">⚠ ${e}</p>`;
const plateOpt=()=>`<label>Placa divisora (furos por círculo, editável)<input id="pl" value="${BS["Brown & Sharpe"].join(",")}"></label>`;
const plate=()=>$("pl").value.split(/[ ,;]+/).map(Number).filter(x=>x>0);

function gearSVG(g){const R=80,s=R/(g.da/2),cx=130,cy=100;
 const c=(r,col,dash)=>`<circle cx="${cx}" cy="${cy}" r="${r*s}" fill="none" stroke="${col}" ${dash?'stroke-dasharray="5 3"':""}/>`;

 <text x="${cx+4}" y="${cy-g.da/2*s-3}" fill="#f2a30f">Øe ${r3(g.da)}</text><text x="${cx+4}" y="${cy-g.d/2*s+11}" fill="#9a9ea5">Øp ${r3(g.d)}</text>
 <text x="${cx+4}" y="${cy-g.db/2*s+11}" fill="#5cc27a">Øb ${r3(g.db)}</text><text x="${cx+4}" y="${cy-g.df/2*s+11}" fill="#e8665a">Øf ${r3(g.df)}</text></svg>`;}

/* ===== "?" nos resultados da engrenagem reta: explicação + imagem ===== */
const RQ_C={or:"#f2a30f",mu:"#9a9ea5",er:"#e8665a",ok:"#5cc27a",tx:"#e8e6e1",fill:"#2f3338",bg:"#1b1d20"};
function rqArrow(x1,y1,x2,y2,col,w){const a=7,dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,px=-uy,py=ux;
 const h=(x,y,s)=>`<polygon points="${x},${y} ${x-s*ux*a+px*3},${y-s*uy*a+py*3} ${x-s*ux*a-px*3},${y-s*uy*a-py*3}" fill="${col}"/>`;
 return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w||2}"/>${h(x2,y2,1)}${h(x1,y1,-1)}`}
function rqTxt(x,y,s,col,anc){return `<text x="${x}" y="${y}" fill="${col||RQ_C.or}" font-size="12" font-weight="700" text-anchor="${anc||"middle"}">${s}</text>`}
/* imagem: círculos (d, da, df, db) */
function rqCircles(g,hl){const R=78,s=R/(g.da/2),cx=180,cy=100,
 C=[["da",g.da,RQ_C.or,"Øe"],["d",g.d,RQ_C.mu,"Øp"],["db",g.db,RQ_C.ok,"Øb"],["df",g.df,RQ_C.er,"Øf"]];
 let o="";for(const [k,D,col,n] of C){const on=k==hl;o+=`<circle cx="${cx}" cy="${cy}" r="${D/2*s}" fill="none" stroke="${on?col:"#555a61"}" stroke-width="${on?3.5:1}" ${k=="d"||k=="db"?'stroke-dasharray="5 3"':""}/>`}
 const sel=C.find(c=>c[0]==hl),r=sel[1]/2*s;
 o+=rqArrow(cx-r,cy,cx+r,cy,sel[2],2)+`<circle cx="${cx}" cy="${cy}" r="2.5" fill="${RQ_C.tx}"/>`;
 o+=rqTxt(cx,cy-6,sel[3]+" = "+r3(sel[1])+" mm",sel[2]);
 C.forEach(([k,D,col,n],i)=>{o+=`<text x="12" y="${22+i*16}" font-size="11" fill="${k==hl?col:"#6f747b"}" font-weight="${k==hl?800:500}">${n} ${r3(D)}</text>`});
 return `<svg viewBox="0 0 360 200" font-family="inherit">${o}</svg>`}
/* imagem: perfil do dente (ha, hf, h, p, s, e) */
function rqTooth(hl,g){const u=36,yp=95,yt=yp-u,yr=yp+1.25*u,c=[70,183,296],W=360,H=200,t20=Math.tan(Math.PI/9);
 const hw=(y)=>Math.PI/4*u+(y-yp)*t20; // meia espessura na altura y
 let d=`M0,${H} L0,${yr}`;for(const x of c)d+=` L${x-hw(yr)},${yr} L${x-hw(yt)},${yt} L${x+hw(yt)},${yt} L${x+hw(yr)},${yr}`;d+=` L${W},${yr} L${W},${H} Z`;
 let o=`<path d="${d}" fill="${RQ_C.fill}" stroke="${RQ_C.mu}" stroke-width="1.2"/>`;
 const band=(y1,y2)=>`<rect x="0" y="${y1}" width="${W}" height="${y2-y1}" fill="${RQ_C.or}" opacity=".22"/>`;
 const ln=(y,col,txt)=>`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="${col}" stroke-width="1" stroke-dasharray="5 3"/>`;
 if(hl=="ha")o+=band(yt,yp);if(hl=="hf")o+=band(yp,yr);if(hl=="h")o+=band(yt,yr);
 o+=ln(yt,RQ_C.or)+ln(yp,"#c9ccd1")+ln(yr,RQ_C.er);
 o+=`<text x="${W-4}" y="${yt-4}" font-size="10" fill="${RQ_C.or}" text-anchor="end">círculo externo</text><text x="${W-4}" y="${yp-4}" font-size="10" fill="#c9ccd1" text-anchor="end">linha primitiva</text><text x="${W-4}" y="${yr+12}" font-size="10" fill="${RQ_C.er}" text-anchor="end">fundo do vão (pé)</text>`;
 const vd=(y1,y2,lab)=>rqArrow(18,y1,18,y2,RQ_C.or,2.5)+rqTxt(30,(y1+y2)/2+4,lab,RQ_C.or,"start");
 if(hl=="ha")o+=vd(yt,yp,"ha = "+r3(g.ha));
 if(hl=="hf")o+=vd(yp,yr,"hf = "+r3(g.hf));
 if(hl=="h")o+=vd(yt,yr,"h = "+r3(g.h));
 if(hl=="p"){o+=`<line x1="${c[0]}" y1="${yp}" x2="${c[0]}" y2="32" stroke="${RQ_C.or}" stroke-dasharray="3 3"/><line x1="${c[1]}" y1="${yp}" x2="${c[1]}" y2="32" stroke="${RQ_C.or}" stroke-dasharray="3 3"/>`+rqArrow(c[0],38,c[1],38,RQ_C.or,2.5)+rqTxt((c[0]+c[1])/2,28,"p = "+r3(g.p)+" mm")}
 if(hl=="s"){const a=c[1]-Math.PI/4*u,b=c[1]+Math.PI/4*u;o+=rqArrow(a,yp,b,yp,RQ_C.or,3)+rqTxt(c[1],yp-6,"s = "+r3(g.s),RQ_C.or)}
 if(hl=="e"){const a=c[1]+Math.PI/4*u,b=c[2]-Math.PI/4*u;o+=rqArrow(a,yp,b,yp,RQ_C.or,3)+rqTxt((a+b)/2,yp-6,"e = "+r3(g.e),RQ_C.or)}
 return `<svg viewBox="0 0 ${W} ${H}" font-family="inherit">${o}</svg>`}
/* imagem: espessura e altura da corda (sc, hc) */
function rqChord(hl,g){const O=RQ_C.or,M=RQ_C.mu,yc=104.5;
 let o=`<path d="M80,200 L80,162.5 A170,170 0 0 1 122,139.6 L158,62 L202,62 L238,139.6 A170,170 0 0 1 280,162.5 L280,200 Z" fill="${RQ_C.fill}" stroke="${M}" stroke-width="1.2"/>`;
 o+=`<path d="M60,140 A200,200 0 0 1 300,140" fill="none" stroke="#c9ccd1" stroke-dasharray="5 3"/><text x="64" y="132" font-size="10" fill="#c9ccd1">círculo primitivo</text>`;
 o+=`<line x1="120" y1="62" x2="300" y2="62" stroke="${O}" stroke-dasharray="5 3"/><text x="296" y="56" font-size="10" fill="${O}" text-anchor="end">topo do dente</text>`;
 const onS=hl=="sc",onH=hl=="hc";
 o+=rqArrow(138,yc,222,yc,onS?O:"#7b8087",onS?3:1.2)+rqArrow(180,62,180,yc,onH?O:"#7b8087",onH?3:1.2);
 o+=rqTxt(180,122,"sc = "+r3(g.sc),onS?O:"#7b8087");o+=rqTxt(186,86,"hc = "+r3(g.hc),onH?O:"#7b8087","start");
 o+=`<text x="12" y="190" font-size="10" fill="#6f747b">desenho fora de escala</text>`;
 return `<svg viewBox="0 0 360 200" font-family="inherit">${o}</svg>`}
/* imagem: jogo de 8 fresas */
function rqCutters(g){const T=["12–13","14–16","17–20","21–25","26–34","35–54","55–134","135+"];let o="";
 T.forEach((r,i)=>{const x=10+(i%4)*86,y=18+Math.floor(i/4)*80,on=(i+1)==g.fresa;
  o+=`<rect x="${x}" y="${y}" width="78" height="66" rx="6" fill="${on?RQ_C.or:RQ_C.fill}" stroke="${on?RQ_C.or:RQ_C.mu}"/><text x="${x+39}" y="${y+30}" text-anchor="middle" font-size="22" font-weight="800" fill="${on?RQ_C.bg:RQ_C.tx}">nº ${i+1}</text><text x="${x+39}" y="${y+52}" text-anchor="middle" font-size="12" fill="${on?RQ_C.bg:RQ_C.mu}">${r} dentes</text>`});
 return `<svg viewBox="0 0 360 180" font-family="inherit">${o}</svg>`}

function rqItems(g,m,z,a){const f=r3;return [
 {t:"Ø primitivo d",v:f(g.d)+" mm",img:()=>rqCircles(g,"d"),
  o:"É o diâmetro do círculo primitivo: o círculo \"imaginário\" onde duas engrenagens se tocam e rolam uma sobre a outra, sem deslizar. Não é uma medida que você vê direto na peça.",
  u:"Serve para calcular a distância entre centros do par: (d1 + d2) / 2. É a referência de todo o dente.",f:`d = m·z = ${m} × ${z} = ${f(g.d)} mm`},
 {t:"Ø externo da",v:f(g.da)+" mm",img:()=>rqCircles(g,"da"),
  o:"É o diâmetro total da engrenagem, medido na ponta dos dentes (o círculo mais externo).",
  u:"É a medida que você torneia no disco ANTES de fresar. Confira com o paquímetro: tem que bater com este valor.",f:`da = m·(z+2) = ${m} × (${z}+2) = ${f(g.da)} mm`},
 {t:"Ø de pé df",v:f(g.df)+" mm",img:()=>rqCircles(g,"df"),
  o:"É o diâmetro do fundo do vão entre os dentes (também chamado diâmetro de raiz). É o menor círculo do dente.",
  u:"Mostra até onde a fresa desce. A profundidade do corte é (da − df) / 2 = altura total h.",f:`df = d − 2,5·m = ${f(g.d)} − 2,5 × ${m} = ${f(g.df)} mm`},
 {t:"Ø de base db",v:f(g.db)+" mm",img:()=>rqCircles(g,"db"),
  o:"É o diâmetro do círculo de base, de onde nasce a curva (evolvente) do flanco do dente. Fica dentro do círculo primitivo e depende do ângulo de pressão.",
  u:"Não se mede na oficina. É dado teórico, usado para o perfil do dente e para conferir o engrenamento.",f:`db = d·cos α = ${f(g.d)} × cos ${a}° = ${f(g.db)} mm`},
 {t:"Cabeça ha",v:f(g.ha)+" mm",img:()=>rqTooth("ha",g),
  o:"Altura da cabeça do dente: a parte do dente que fica ACIMA do círculo primitivo, até a ponta.",
  u:"É igual ao módulo. Ajuda a conferir a altura da ponta do dente.",f:`ha = m = ${f(g.ha)} mm`},
 {t:"Pé hf",v:f(g.hf)+" mm",img:()=>rqTooth("hf",g),
  o:"Altura do pé do dente: a parte que fica ABAIXO do círculo primitivo, até o fundo do vão. É maior que a cabeça para sobrar folga para a ponta do dente da outra engrenagem.",
  u:"Define a profundidade do vão abaixo da linha primitiva.",f:`hf = 1,25·m = 1,25 × ${m} = ${f(g.hf)} mm`},
 {t:"Altura total h",v:f(g.h)+" mm",img:()=>rqTooth("h",g),
  o:"Altura completa do dente, da ponta até o fundo do vão (cabeça + pé).",
  u:"É a profundidade total que a mesa sobe a partir do toque da fresa no Ø externo. Suba em passes (desbaste e acabamento), não de uma vez.",f:`h = 2,25·m = 2,25 × ${m} = ${f(g.h)} mm`},
 {t:"Passo circular p",v:f(g.p)+" mm",img:()=>rqTooth("p",g),
  o:"Distância de um dente ao próximo (mesmo ponto em dentes vizinhos), medida em arco no círculo primitivo.",
  u:"Comparar o passo é um jeito de identificar o módulo de uma engrenagem. Os dois dentes que engrenam precisam ter o mesmo passo.",f:`p = π·m = 3,1416 × ${m} = ${f(g.p)} mm`},
 {t:"Espessura teórica s",v:f(g.s)+" mm",img:()=>rqTooth("s",g),
  o:"Largura do dente medida no círculo primitivo, em arco. Teoricamente é metade do passo.",
  u:"É o valor teórico, sem folga. Na prática o paquímetro mede a corda (sc), que é um pouco menor.",f:`s = p / 2 = ${f(g.p)} / 2 = ${f(g.s)} mm`},
 {t:"Vão teórico e",v:f(g.e)+" mm",img:()=>rqTooth("e",g),
  o:"Largura do espaço entre dois dentes, medida no círculo primitivo. Teoricamente é igual à espessura do dente.",
  u:"É o espaço onde entra o dente da outra engrenagem. Na fabricação real costuma-se dar uma pequena folga (backlash).",f:`e = p / 2 = ${f(g.p)} / 2 = ${f(g.e)} mm`},
 {t:"Espessura da corda sc",v:f(g.sc)+" mm",img:()=>rqChord("sc",g),
  o:"Largura do dente medida em linha reta (a corda) no círculo primitivo. É o que o paquímetro de engrenagens realmente mede, porque ele não mede o arco.",
  u:"Ajuste o paquímetro de engrenagens em hc (altura da corda) e meça o dente: a leitura tem que ser igual a sc.",f:`sc = d·sen(90°/z) = ${f(g.d)} × sen(90°/${z}) = ${f(g.sc)} mm`},
 {t:"Altura da corda hc",v:f(g.hc)+" mm",img:()=>rqChord("hc",g),
  o:"Distância da ponta do dente até a corda sc. Dá a profundidade onde o paquímetro deve encostar para medir sc.",
  u:"Regule a haste vertical do paquímetro de engrenagens em hc, apoie na ponta do dente e leia sc na haste horizontal.",f:`hc = ha + (d/2)·(1 − cos(90°/z)) = ${f(g.hc)} mm`},
 {t:"Fresa módulo",v:g.fresa?"nº "+g.fresa+" de 8":"—",img:()=>rqCutters(g),
  o:"Qual fresa do jogo de 8 fresas módulo usar. O perfil do dente muda um pouco conforme o número de dentes, então cada fresa serve para uma faixa de z.",
  u:`Use a fresa de módulo ${m} com ângulo ${a}° e número ${g.fresa}. Para ${z} dentes ela é a indicada (destacada na imagem).`,f:`z = ${z} dentes → fresa nº ${g.fresa}`}
]}
function rqOpen(i){const it=window._rq&&window._rq[i];if(!it)return;
 let m=document.getElementById("hm");
 if(!m){m=document.createElement("div");m.id="hm";m.className="hide";m.onclick=e=>{if(e.target===m)m.className="hide"};document.body.appendChild(m)}
 if(window._c3){try{window._c3()}catch(e){}window._c3=null}
 m.innerHTML='<div class="bx"><h3></h3><div class="im rs"></div><p><b>O que é:</b> <span class="a1"></span></p><p><b>Como usar na usinagem:</b> <span class="a2"></span></p><div class="fm"></div><button type="button">Entendi</button></div>';
 m.querySelector("h3").textContent=it.t+"  =  "+it.v;
 m.querySelector(".im").innerHTML=it.img();
 m.querySelector(".a1").textContent=it.o;m.querySelector(".a2").textContent=it.u;m.querySelector(".fm").textContent=it.f;
 m.querySelector("button").onclick=()=>{m.className="hide"};m.className="";}
function addResQ(g,m,z,a){window._rq=rqItems(g,m,z,a);
 const tb=document.querySelector("#o table");if(!tb)return;
 tb.querySelectorAll("tr").forEach((tr,i)=>{const td=tr.firstElementChild;if(!td||!window._rq[i])return;
  const b=document.createElement("button");b.type="button";b.className="q r";b.textContent="?";b.setAttribute("aria-label","O que é: "+window._rq[i].t);
  b.onclick=e=>{e.preventDefault();e.stopPropagation();rqOpen(i)};td.appendChild(b)});
 const c=tb.closest(".card"),h2=c&&c.querySelector("h2");
 if(h2&&!c.querySelector(".rqn")){const p=document.createElement("p");p.className="note rqn";p.style.margin="0 0 8px";p.textContent="Toque no ? ao lado de cada resultado para ver o que ele significa e a imagem.";h2.after(p)}}
function doGear(){try{const m=N("m"),z=N("z"),a=N("a"),b=N("b"),g=spur(m,z,a,b);
 const steps=["Identificação: engrenagem reta m"+m+" z"+z+" α"+a+"°, largura "+b+" mm.","Material: confirme o material do disco; aço/ferro exigem refrigeração e avanço conservador.",
 "Preparar o disco: torneie Ø externo "+r3(g.da)+" mm, furo/eixo e faces; largura "+b+" mm.","Ferramenta: fresa módulo "+m+", α "+a+"°, nº "+g.fresa+" do jogo de 8 (z="+z+").",
 "Montar o cabeçote divisor entre pontas ou no mandril, com a peça em mandril expansível; centralizar a fresa no eixo da peça (conferir com riscador).",
 "Divisão: "+z+" dentes → use a aba Divisor (R=40).","Zerar a fresa tocando o Ø externo e subir a mesa "+r3(g.h)+" mm em passes (desbaste + acabamento).",
 "Parâmetros de corte: aba Corte (Vc e fz iniciais conforme material).","Usinar vão a vão, retornando sem raspar a fresa.",
 "Conferir espessura da corda no paquímetro de engrenagens: sc = "+r3(g.sc)+" mm a hc = "+r3(g.hc)+" mm.","Inspeção final: Øe "+r3(g.da)+", passo "+r3(g.p)+", rebarbas, acabamento."];
 out("o",`<div class="card"><h2>Resultados</h2>${rows([["Ø primitivo d",r3(g.d)+" mm","d = m·z"],["Ø externo da",r3(g.da)+" mm","da = m(z+2)"],["Ø de pé df",r3(g.df)+" mm","df = d − 2,5m"],["Ø de base db",r3(g.db)+" mm","db = d·cosα"],
 ["Cabeça ha",r3(g.ha)+" mm","ha = m"],["Pé hf",r3(g.hf)+" mm","hf = 1,25m"],["Altura total h",r3(g.h)+" mm","h = 2,25m"],["Passo circular p",r3(g.p)+" mm","p = π·m"],["Espessura teórica s",r3(g.s)+" mm","s = p/2"],["Vão teórico e",r3(g.e)+" mm","e = p/2"],
 ["Espessura da corda sc",r3(g.sc)+" mm","sc = d·sen(90°/z)"],["Altura da corda hc",r3(g.hc)+" mm","hc = ha + (d/2)(1−cos(90°/z))"],["Fresa módulo",g.fresa?"nº "+g.fresa+" de 8":"—","jogo de 8 fresas"]])}${gearSVG(g)}
 <p class="note">Perfil básico 20°: ISO 53 / DIN 867 (referência). Valores teóricos; folga e tolerância de fabricação conforme classe exigida (DIN 3961/ISO 1328) — não aplicadas aqui.</p></div>
 <div class="card"><h2>Passo a passo de fabricação</h2><ol>${steps.map(s=>`<li>${s}</li>`).join("")}</ol></div>`);
 addResQ(g,m,z,a);

/* ===== MOTOR REALISTA: aço polido, rosca helicoidal, normais suaves ===== */
const hsh=(a,b)=>{const s=Math.sin(a*127.1+b*311.7)*43758.5453;return s-Math.floor(s)};
const BRZ=[204,152,84],BLK=[22,22,25],GY2=[118,124,132],PLS=[36,38,42],BRT=[200,204,210];
/* torneado: perfil [[z,r],...] girado em volta do eixo z, normais suaves em torno do eixo */
function lathe(P,n,c,o={}){
 const f=[],g=o.g==null?.55:o.g,ms=o.ms||3,nz0=o.noise==null?.02:o.noise;let band=0;
 for(let k=0;k<P.length-1;k++){
  const z0=P[k][0],r0=P[k][1],z1=P[k+1][0],r1=P[k+1][1],dz=z1-z0,dr=r1-r0,L=Math.hypot(dz,dr);
  if(L<1e-6)continue;
  const nz=-dr/L,nr=dz/L,S=Math.max(1,Math.ceil(L/ms));
  for(let s=0;s<S;s++){
   const za=z0+dz*s/S,ra=r0+dr*s/S,zb=z0+dz*(s+1)/S,rb=r0+dr*(s+1)/S;band++;
   const tone=1+nz0*(hsh(band,3)*2-1);
   for(let i=0;i<n;i++){
    const t0=i*PI2/n,t1=(i+1)*PI2/n,tm=(t0+t1)/2,cs=o.col?o.col(k,s,i,za,ra):null,b=cs||c;
    f.push({v:[[ra*Math.cos(t0),ra*Math.sin(t0),za],[ra*Math.cos(t1),ra*Math.sin(t1),za],[rb*Math.cos(t1),rb*Math.sin(t1),zb],[rb*Math.cos(t0),rb*Math.sin(t0),zb]],

 const ac=p=>{for(let i=0;i<3;i++){if(p[i]<mn[i])mn[i]=p[i];if(p[i]>mx[i])mx[i]=p[i]}};
 S.m.forEach(f=>f.v.forEach(ac));S.l.forEach(l=>l.p.forEach(ac));S.t.forEach(t=>ac(t.p));
 const c=mn.map((v,i)=>(v+mx[i])/2);let R=1;

   if(f.n){const n=rt(f.n);if(n[0]*(-cx)+n[1]*(-cy)+n[2]*(DC-z)<=0)continue;fs.push({r,z,c:f.c,n,g:f.g==null?.5:f.g})}
   else fs.push({r,z,c:f.c})}

   if(f.n){col=metal(f.n,f.c,f.g)}
   else{const a=f.r[0],b=f.r[1],d=f.r[2],ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2],wx=d[0]-a[0],wy=d[1]-a[1],wz=d[2]-a[2];

  ctx.textAlign="center";

  if(S.n){let sz=10;ctx.font="700 "+sz+"px sans-serif";while(ctx.measureText(S.n).width>250&&sz>6){sz-=.5;ctx.font="700 "+sz+"px sans-serif"}ctx.fillStyle=ORS;ctx.fillText(S.n,130,168)}

 cv.onpointerdown=e=>{drag=[e.clientX,e.clientY];yaw=cur;auto=false;try{cv.setPointerCapture(e.pointerId)}catch(x){}};

(function(){

/* sólido: faces laterais + tampas em anel + (setor) faces de corte */

 for(let k=0;k<E;k++){const j=(k+1)%n;
  F.push({v:[[I[k][0],I[k][1],z1],[I[j][0],I[j][1],z1],[pts[j][0],pts[j][1],z1],[pts[k][0],pts[k][1],z1]],c:B,n:[0,0,1],g:.5},
   {v:[[I[k][0],I[k][1],z0],[I[j][0],I[j][1],z0],[pts[j][0],pts[j][1],z0],[pts[k][0],pts[k][1],z0]],c:B,n:[0,0,-1],g:.5})}

  [[0,1],[n-1,-1]].forEach(([k,sg])=>{const p=pts[k],a=Math.atan2(p[1],p[0]);
   F.push({v:[[p[0],p[1],z0],[I[k][0],I[k][1],z0],[I[k][0],I[k][1],z1],[p[0],p[1],z1]],c:B,n:[sg*Math.sin(a),-sg*Math.cos(a),0],g:.5})});
  for(let k=0;k<n-1;k++){const mx=(I[k][0]+I[k+1][0])/2,my=(I[k][1]+I[k+1][1])/2,l=Math.hypot(mx,my)||1;
   F.push({v:[[I[k][0],I[k][1],z0],[I[k+1][0],I[k+1][1],z0],[I[k+1][0],I[k+1][1],z1],[I[k][0],I[k][1],z1]],c:B,n:[-mx/l,-my/l,0],g:.5})}}

/* engrenagem completa ou setor com N dentes. o: full,i0,i1,hi:[[dente,cor]],gap:[dente,cor],base */
function gearModel(G,o){o=o||{};const full=o.full!==false,N=outline(G,o.i0,o.i1,full),pts=N.pts,T=N.T,b=G.b,

 const colE=k=>{for(const h of o.hi||[]){const t=T[h[0]];if(t&&k>=t[0]&&k<t[1])return h[1]}
  if(o.gap){const a=T[o.gap[0]],c=T[o.gap[0]+1];if(a&&c&&k>=a[3]&&k<c[2])return o.gap[1]}return o.base||STL};

 for(const h of o.hi||[]){const t=T[h[0]];if(!t)continue;const poly=pts.slice(t[0],t[1]+1);fan(F,poly,h[1],b/2+.06,1);fan(F,poly,h[1],-b/2-.06,-1)}

   {v:[[A[0],A[1],z1],[C[0],C[1],z1],[C[0],yB,z1],[A[0],yB,z1]],c:B,n:[0,0,1],g:.5},

/* helpers de linhas */

  n:C.map(c=>c[3]+" "+r3(2*c[1])).join("  ·  "),studio:1,pit:.5,yaw:.2,sway:.45,zoom:.8}}
